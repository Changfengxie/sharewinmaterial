<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 463" width="480" height="463" role="img" aria-labelledby="swTitle swDesc">
  <title id="swTitle">Sharewin Material Logo</title>
  <desc id="swDesc">Running horse logo for Sharewin Material packaging company</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="463" rx="16" fill="url(#bgGrad)" opacity="0.6"/>

  <!-- Ground line -->
  <ellipse cx="240" cy="390" rx="180" ry="12" fill="#2a2a4a" opacity="0.15"/>

  <!-- Horse body - white with tint -->
  <g filter="url(#softShadow)">
    <!-- Main body -->
    <path d="M 140 250 Q 160 200 220 195 Q 280 190 320 210 Q 360 230 370 270 Q 375 310 350 340 Q 320 365 280 360 Q 240 358 210 340 Q 175 320 160 290 Q 145 270 140 250 Z" fill="#fafcff" stroke="#d0d8e8" stroke-width="1.5"/>
    <!-- Belly tint -->
    <path d="M 180 310 Q 240 345 320 325 Q 340 315 345 295 Q 300 335 220 330 Q 190 325 180 310 Z" fill="#e8f0f8" opacity="0.7"/>
    <!-- Chest tint -->
    <path d="M 145 255 Q 155 230 180 220 Q 200 215 210 230 Q 195 250 170 265 Q 152 270 145 255 Z" fill="#fff5e6" opacity="0.6"/>
  </g>

  <!-- Horse head -->
  <g filter="url(#softShadow)">
    <path d="M 330 180 Q 360 160 385 175 Q 410 195 405 225 Q 395 250 370 255 Q 350 252 340 235 Q 330 215 330 180 Z" fill="#fafcff" stroke="#d0d8e8" stroke-width="1.5"/>
    <!-- Snout -->
    <path d="M 385 210 Q 410 215 415 235 Q 410 250 395 248 Q 385 240 385 210 Z" fill="#fff8f0" stroke="#d8d0c8" stroke-width="1"/>
    <!-- Nostril -->
    <ellipse cx="408" cy="230" rx="3" ry="4" fill="#3a3a5a"/>
    <!-- Eye -->
    <ellipse cx="378" cy="200" rx="5" ry="6" fill="#1a1a2e"/>
    <circle cx="376" cy="198" r="1.5" fill="#fff"/>
    <!-- Ear -->
    <path d="M 365 168 Q 372 150 380 168 Q 375 178 365 175 Z" fill="#1a1a2e"/>
  </g>

  <!-- Mane - flowing black -->
  <g>
    <path d="M 340 175 Q 320 140 300 155 Q 285 170 295 185 Q 310 170 330 190 Q 335 180 340 175 Z" fill="url(#maneGrad)"/>
    <path d="M 330 190 Q 305 155 280 170 Q 265 190 280 205 Q 300 190 320 210 Q 328 200 330 190 Z" fill="url(#maneGrad)" opacity="0.9"/>
    <path d="M 315 210 Q 285 175 260 195 Q 245 215 260 230 Q 285 215 310 230 Q 318 220 315 210 Z" fill="url(#maneGrad)" opacity="0.85"/>
    <path d="M 295 230 Q 265 200 240 220 Q 228 240 245 252 Q 270 240 290 250 Q 298 240 295 230 Z" fill="url(#maneGrad)" opacity="0.8"/>
    <!-- Mane highlights -->
    <path d="M 310 185 Q 290 160 275 175" stroke="#3a3a5e" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 295 210 Q 270 185 255 200" stroke="#3a3a5e" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Tail - flowing black -->
  <g>
    <path d="M 142 245 Q 110 220 85 245 Q 70 270 80 290 Q 100 275 120 290 Q 130 270 142 265 Z" fill="url(#maneGrad)"/>
    <path d="M 138 265 Q 100 255 75 280 Q 60 305 75 318 Q 100 305 125 312 Q 135 295 138 280 Z" fill="url(#maneGrad)" opacity="0.9"/>
    <path d="M 148 280 Q 115 280 95 300 Q 85 318 100 328 Q 120 318 142 320 Q 148 305 148 290 Z" fill="url(#maneGrad)" opacity="0.8"/>
    <!-- Tail wisps -->
    <path d="M 85 290 Q 65 305 70 325" stroke="#1a1a2e" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M 95 300 Q 78 318 82 338" stroke="#1a1a2e" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Legs - dynamic running pose -->
  <g stroke="url(#inkGrad)" stroke-width="6" stroke-linecap="round" fill="none">
    <!-- Front leg 1 - extended forward -->
    <path d="M 310 340 Q 330 370 350 385" stroke-width="5"/>
    <!-- Front leg 2 - raised -->
    <path d="M 330 335 Q 360 340 370 365" stroke-width="5"/>
    <!-- Back leg 1 - pushing off -->
    <path d="M 185 340 Q 165 365 155 385" stroke-width="5.5"/>
    <!-- Back leg 2 - extended back -->
    <path d="M 165 335 Q 140 350 125 375" stroke-width="5"/>
  </g>
  <!-- Hooves -->
  <g fill="#1a1a2e">
    <ellipse cx="350" cy="388" rx="8" ry="5"/>
    <ellipse cx="370" cy="368" rx="7" ry="4.5"/>
    <ellipse cx="155" cy="388" rx="8" ry="5"/>
    <ellipse cx="125" cy="378" rx="7" ry="4.5"/>
  </g>

  <!-- Body contour lines (ink wash style) -->
  <g stroke="#2a2a4a" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M 170 265 Q 220 250 280 260"/>
    <path d="M 185 290 Q 240 280 300 290"/>
    <path d="M 200 315 Q 250 310 310 320"/>
  </g>

  <!-- Ink splash accents -->
  <g opacity="0.25">
    <circle cx="100" cy="350" r="4" fill="#1a1a2e"/>
    <circle cx="115" cy="365" r="2.5" fill="#1a1a2e"/>
    <circle cx="90" cy="335" r="3" fill="#1a1a2e"/>
    <circle cx="400" cy="350" r="3.5" fill="#1a1a2e"/>
    <circle cx="415" cy="335" r="2" fill="#1a1a2e"/>
    <circle cx="105" cy="320" r="2" fill="#1a1a2e"/>
  </g>

  <!-- Text: Sharewin -->
  <text x="240" y="425" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#1a1a2e" letter-spacing="1">Sharewin</text>
  <!-- Text: Material -->
  <text x="240" y="448" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="normal" fill="#3a5a8a" letter-spacing="3">Material</text>

  <!-- Decorative line under text -->
  <line x1="170" y1="455" x2="310" y2="455" stroke="#c9a96e" stroke-width="1.5" opacity="0.7"/>
</svg>
